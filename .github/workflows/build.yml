name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore CS-OOP.slnx

      - run: dotnet build CS-OOP.slnx --no-restore --configuration Release

      - run: dotnet test CS-OOP.slnx --no-build --configuration Release --logger "console;verbosity=normal"
